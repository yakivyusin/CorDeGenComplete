name: Build and Test
on:
  push:
    branches:
      - master
env:
  DOTNET_VERSION: '8.0.x'
jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup DotNet ${{ env.DOTNET_VERSION }} Environment
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build
        shell: pwsh
        run: |
          dotnet build CorDeGen.sln -c Release
          
      - name: Test
        shell: pwsh
        run: |
          dotnet test CorDeGen.sln -c Release --no-build